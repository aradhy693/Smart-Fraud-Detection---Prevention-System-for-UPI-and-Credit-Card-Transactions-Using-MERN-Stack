services:
  mongodb:
    image: mongo:7
    container_name: fraud-mongodb
    command: ["mongod", "--auth", "--bind_ip_all"]
    ports:
      - "${MONGO_BIND_IP:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-smart_fraud_detection}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$${MONGO_INITDB_ROOT_USERNAME}\" -p \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build:
      context: ./ai-engine
    container_name: fraud-ai-engine
    ports:
      - "8000:8000"
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-random-forest-hybrid-v1}
      MODEL_DIR: /app/model
      DATA_DIR: /app/data
      AI_CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5000,http://backend:5000}
      MEDIUM_RISK_THRESHOLD: ${MEDIUM_RISK_THRESHOLD:-0.40}
      HIGH_RISK_THRESHOLD: ${HIGH_RISK_THRESHOLD:-0.75}
      SYNTHETIC_TRAINING_ROWS: ${SYNTHETIC_TRAINING_ROWS:-6000}
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:?Set AI_ENGINE_API_KEY}
    volumes:
      - ai_model:/app/model
      - ai_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fraud-backend
    ports:
      - "5000:5000"
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:?Set authenticated MONGO_URI}
      REQUIRE_MONGO_AUTH: ${REQUIRE_MONGO_AUTH:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ACCESS_TOKEN_EXPIRES_IN: ${ACCESS_TOKEN_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET}
      ADMIN_REGISTRATION_KEY: ${ADMIN_REGISTRATION_KEY:?Set ADMIN_REGISTRATION_KEY}
      AI_ENGINE_API_KEY: ${AI_ENGINE_API_KEY:?Set AI_ENGINE_API_KEY}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?Set MASTER_ENCRYPTION_KEY}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai-engine:8000}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-4500}
      AI_REQUEST_RETRY_ATTEMPTS: ${AI_REQUEST_RETRY_ATTEMPTS:-2}
      GEOLOCATION_URL: ${GEOLOCATION_URL:-http://ip-api.com/json}
      GEOLOCATION_TIMEOUT_MS: ${GEOLOCATION_TIMEOUT_MS:-3500}
      GEOLOCATION_RETRY_ATTEMPTS: ${GEOLOCATION_RETRY_ATTEMPTS:-2}
      GEOLOCATION_CACHE_TTL_MS: ${GEOLOCATION_CACHE_TTL_MS:-600000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-200}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      TRANSACTION_RATE_LIMIT_MAX: ${TRANSACTION_RATE_LIMIT_MAX:-30}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

volumes:
  mongo_data:
  ai_model:
  ai_data:
